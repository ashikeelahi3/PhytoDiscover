services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: phyto
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: phytodiscover
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U phyto -d phytodiscover"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  flower:
    image: mher/flower:2.0.0
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "127.0.0.1:5555:5555"
    environment:
      - CELERY_BROKER_URL=${REDIS_URL}
    command: celery flower --broker=${REDIS_URL} --port=5555

volumes:
  postgres_data:

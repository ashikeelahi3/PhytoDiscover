[workspace]
authors = ["Khalid Muntasir <kmuntasirsawad@gmail.com>"]
channels = ["conda-forge", "main", "r", "msys2"]
name = "phytodiscover"
platforms = ["linux-64"]
version = "0.1.0"

[tasks]

[dependencies]
python = "3.11.*"
rdkit = "*"
openbabel = ">=3.1.1,<4"
nodejs = "20.*"
pip = "*"

[pypi-dependencies]
fastapi = ">=0.111.0"
uvicorn = { version = ">=0.29.0", extras = ["standard"] }
sqlalchemy = ">=2.0.30"
alembic = ">=1.13.0"
psycopg2-binary = ">=2.9.9"
celery = { version = ">=5.4.0", extras = ["redis"] }
redis = { version = ">=5.0.4", extras = ["asyncio"] }
pydantic = ">=2.7.0"
pydantic-settings = ">=2.2.0"
python-dotenv = ">=1.0.1"
httpx = ">=0.27.0"
requests = ">=2.32.0"
biopython = ">=1.83"
pytest = ">=8.2.0"
pytest-asyncio = ">=0.23.0"
nglview = ">=4.0.1"
ipywidgets = ">=8.1.8"
py3dmol = ">=2.5.5"
AutoDockTools_py3 = {git = "https://github.com/Valdes-Tresanco-MS/AutoDockTools_py3.git"}
